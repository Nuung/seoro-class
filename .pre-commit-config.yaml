ci:
  autoupdate_schedule: monthly

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^docs/assets/classroom-(concept|storyboard)\.png$
      # 생성 일러스트 두 개만 3 MiB까지 허용하고, 나머지는 기본 제한을 유지합니다.
      - id: check-added-large-files
        name: 콘셉트 일러스트 크기 검사
        files: ^docs/assets/classroom-(concept|storyboard)\.png$
        args: [--maxkb=3072, --enforce-all]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.2
    hooks:
      - id: uv-export
        args:
          - --frozen
          - --no-dev
          - --no-hashes
          - --output-file=requirements.txt
          - --quiet
